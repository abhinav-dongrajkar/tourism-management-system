<!DOCTYPE HTML>
<html>
<head>
<title>TMS | My Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700,600' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700,300' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet' type='text/css'>
<link href="css/font-awesome.css" rel="stylesheet">
<link href="css/animate.css" rel="stylesheet" type="text/css" media="all">
<link href="css/custom.css" rel="stylesheet" type="text/css">
<script src="js/jquery-1.12.0.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/wow.min.js"></script>
<script src="js/seed.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div id="tms-header"></div>
<div class="banner-1">
	<div class="container">
		<h1 class="wow zoomIn animated" data-wow-delay=".5s">TMS-Tourism Management System</h1>
	</div>
</div>
<div class="privacy">
	<div class="container">
		<h3 class="wow fadeInDown animated" data-wow-delay=".5s">My Profile!!</h3>
		<div id="msg"></div>
		<form name="profile" id="profile-form">
			<p style="width: 350px;"><b>Name</b> <input type="text" name="name" id="name" class="form-control" required></p>
			<p style="width: 350px;"><b>Mobile Number</b> <input type="text" class="form-control" name="mobileno" id="mobileno" maxlength="10" pattern="[0-9]{10}" title="Enter a 10 digit mobile number" required></p>
			<p style="width: 350px;"><b>Email Id</b> <input type="email" class="form-control" name="email" id="email" readonly></p>
			<p style="width: 350px;"><b>Last Updation Date : </b> <span id="upd"></span></p>
			<p style="width: 350px;"><b>Reg Date :</b> <span id="reg"></span></p>
			<p style="width: 350px;"><button type="submit" class="btn-primary btn">Update</button></p>
		</form>
	</div>
</div>

<div id="tms-footer"></div>
<div id="tms-modals"></div>
<script>
TMS_UI.boot({ auth: true }, function (user) {
  function fill() {
    var u = TMS.users.get(user);
    $('#name').val(u.FullName); $('#mobileno').val(u.MobileNumber); $('#email').val(u.EmailId);
    $('#upd').text(u.UpdationDate || ''); $('#reg').text(u.RegDate || '');
  }
  fill();
  $('#profile-form').on('submit', function (e) {
    e.preventDefault();
    TMS.users.update(user, { name: $.trim(this.name.value), mobile: this.mobileno.value });
    fill();
    $('#msg').html(TMS_UI.msg('success', 'Profile Updated Successfully'));
  });
});
</script>
</body>
</html>
