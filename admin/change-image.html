<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Update Package Image</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.min.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href="css/font-awesome.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="css/table-style.css" />
<link rel="stylesheet" type="text/css" href="css/basictable.css" />
<link href='https://fonts.googleapis.com/css?family=Roboto:700,500,300,100italic,100,400' rel='stylesheet' type='text/css'/>
<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="css/icon-font.min.css" type='text/css' />
<link rel="stylesheet" href="css/custom.css" type='text/css' />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/jquery.basictable.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.nicescroll.js"></script>
<script src="js/scripts.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin.js"></script>
</head>
<body>
<div class="page-container">
	<div class="left-content">
		<div class="mother-grid-inner">
			<div id="adm-header"></div>
			<ol class="breadcrumb" id="adm-crumb"></ol>
			<div class="grid-form">
				<div class="grid-form1">
					<h3>Update Package Image </h3>
					<div id="msg"></div>
					<div class="tab-content"><div class="tab-pane active" id="horizontal-form">
						<form class="form-horizontal" id="img-form" name="package">
					<div class="form-group">
						<label class="col-sm-2 control-label">Package Image</label>
						<div class="col-sm-8"><img id="pkg-img" src="" width="200"></div>
					</div>
					<div class="form-group">
						<label class="col-sm-2 control-label">New Image</label>
						<div class="col-sm-8"><input type="file" name="packageimage" accept="image/*" required></div>
					</div>
							<div class="row"><div class="col-sm-8 col-sm-offset-2">
								<button type="submit" class="btn-primary btn">Update</button>
								<a href="#" id="back-link" class="btn btn-default">Back to package</a>
							</div></div>
						</form>
					</div></div>
				</div>
			</div>
			<div class="inner-block"></div>
			<div id="adm-footer"></div>
		</div>
	</div>
	<div id="adm-sidebar"></div>
	<div class="clearfix"></div>
</div>
<script>
ADM.boot({ crumb: 'Update Package Image' }, function () {
  var id = ADM.qs('imgid');
  var p = TMS.packages.get(id);
  if (!p) { $('#img-form').replaceWith('<p class="tms-empty">Package not found. <a href="manage-packages.html">Back to Manage Packages</a></p>'); return; }
  $('#pkg-img').attr('src', TMS.imgSrc(p.PackageImage, 'pacakgeimages/'));
  $('#back-link').attr('href', 'update-package.html?pid=' + encodeURIComponent(id));
  $('#img-form').on('submit', function (e) {
    e.preventDefault();
    var f = this;
    TMS.fileToDataURL(f.packageimage.files[0], 900, 0.82).then(function (img) {
      TMS.packages.setImage(id, img);
      $('#pkg-img').attr('src', img);
      $('#msg').html(ADM.msg('success', 'Package Image Updated Successfully'));
      f.reset();
    }).catch(function (err) {
      $('#msg').html(ADM.msg('error', err.message || 'Something went wrong. Please try again'));
    });
  });
});
</script>
</body>
</html>
