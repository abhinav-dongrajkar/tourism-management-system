<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Admin manage Issues</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.min.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href="css/font-awesome.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="css/table-style.css" />
<link rel="stylesheet" type="text/css" href="css/basictable.css" />
<link href='https://fonts.googleapis.com/css?family=Roboto:700,500,300,100italic,100,400' rel='stylesheet' type='text/css'/>
<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="css/icon-font.min.css" type='text/css' />
<link rel="stylesheet" href="css/custom.css" type='text/css' />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/jquery.basictable.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.nicescroll.js"></script>
<script src="js/scripts.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin.js"></script>
</head>
<body>
<div class="page-container">
	<div class="left-content">
		<div class="mother-grid-inner">
			<div id="adm-header"></div>
			<ol class="breadcrumb" id="adm-crumb"></ol>
			<div class="agile-grids">
				<div id="msg"></div>
				<div class="agile-tables">
					<div class="w3l-table-info">
						<h2>Manage Issues</h2>
						<table id="table">
							<thead><tr><th>#</th><th>Name</th><th>Mobile No.</th><th>Email Id</th><th>Issues </th><th>Description </th><th>Posting date </th><th>Action </th></tr></thead>
							<tbody></tbody>
						</table>
						<p id="table-empty" class="tms-empty" style="display:none"></p>
					</div>
				</div>
			</div>
			<div class="inner-block"></div>
			<div id="adm-footer"></div>
		</div>
	</div>
	<div id="adm-sidebar"></div>
	<div class="clearfix"></div>
</div>
<script>
ADM.boot({ crumb: 'Manage Issues' }, function () {
  var esc = TMS.esc, popUpWin = null;
  function render() {
    var rows = TMS.issues.all().map(function (i) {
      return '<tr><td width="120">#00' + esc(i.id) + '</td><td width="50">' + esc(i.FullName) + '</td>' +
        '<td width="50">' + esc(i.MobileNumber) + '</td><td width="50">' + esc(i.UserEmail) + '</td>' +
        '<td width="200">' + esc(i.Issue) + '</td><td width="400">' + esc(i.Description) + '</td>' +
        '<td width="50">' + esc(i.PostingDate) + '</td>' +
        '<td><a href="#" data-id="' + esc(i.id) + '" class="btn btn-primary btn-block issue-view">View </a>' +
        '<a href="#" data-id="' + esc(i.id) + '" class="btn btn-danger btn-block issue-del">Delete</a></td></tr>';
    }).join('');
    ADM.renderTable(rows, 'No issues have been raised.');
  }
  render();
  // the "View" button opens the remark form in a small pop-up window
  $(document).on('click', '.issue-view', function (e) {
    e.preventDefault();
    if (popUpWin && !popUpWin.closed) popUpWin.close();
    popUpWin = window.open('updateissue.html?iid=' + $(this).data('id'), 'popUpWin',
      'toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=no,width=600,height=600');
  });
  $(document).on('click', '.issue-del', function (e) {
    e.preventDefault();
    if (!confirm('Do you really want to delete?')) return;
    TMS.issues.remove($(this).data('id'));
    alert('Record deleted.');
    render();
  });
  window.refreshIssues = render;   // called by the pop-up after saving a remark
});
</script>
</body>
</html>
