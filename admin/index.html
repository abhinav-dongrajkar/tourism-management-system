<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Admin Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.min.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href="css/font-awesome.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="css/table-style.css" />
<link rel="stylesheet" type="text/css" href="css/basictable.css" />
<link href='https://fonts.googleapis.com/css?family=Roboto:700,500,300,100italic,100,400' rel='stylesheet' type='text/css'/>
<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="css/icon-font.min.css" type='text/css' />
<link rel="stylesheet" href="css/custom.css" type='text/css' />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/jquery.basictable.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.nicescroll.js"></script>
<script src="js/scripts.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin.js"></script>
</head>
<body>
<div class="main-wthree">
	<div class="container">
		<div class="sin-w3-agile">
			<h2>Sign In</h2>
			<form id="login-form">
				<div class="username">
					<span class="username">Username:</span>
					<input type="text" name="username" class="name" placeholder="" required>
					<div class="clearfix"></div>
				</div>
				<div><a href="forgot-password.html" style="color: #fff;">Forgot Password</a></div>
				<br>
				<div class="password-agileits">
					<span class="username">Password:</span>
					<input type="password" name="password" class="password" placeholder="" required>
					<div class="clearfix"></div>
				</div>
				<div class="login-w3"><input type="submit" class="login" value="Sign In"></div>
				<div class="clearfix"></div>
			</form>
			<div class="back"><a href="../index.html" style="color: #fff;">Back to home</a></div>
		</div>
	</div>
</div>
<script>
if (TMS.admin.current() && TMS.admin.get(TMS.admin.current())) { location.replace('dashboard.html'); }
$('#login-form').on('submit', function (e) {
  e.preventDefault();
  if (TMS.admin.login($.trim(this.username.value), this.password.value)) {
    location.href = 'dashboard.html';
  } else {
    alert('Invalid Details');
  }
});
</script>
</body>
</html>
