<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Manage Pages</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.min.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href="css/font-awesome.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="css/table-style.css" />
<link rel="stylesheet" type="text/css" href="css/basictable.css" />
<link href='https://fonts.googleapis.com/css?family=Roboto:700,500,300,100italic,100,400' rel='stylesheet' type='text/css'/>
<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="css/icon-font.min.css" type='text/css' />
<link rel="stylesheet" href="css/custom.css" type='text/css' />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/jquery.basictable.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.nicescroll.js"></script>
<script src="js/scripts.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin.js"></script>
<script src="nicEdit.js"></script>
</head>
<body>
<div class="page-container">
	<div class="left-content">
		<div class="mother-grid-inner">
			<div id="adm-header"></div>
			<ol class="breadcrumb" id="adm-crumb"></ol>
			<div class="grid-form">
				<div class="grid-form1">
					<h3>Update Page Data</h3>
					<div id="msg"></div>
					<div class="tab-content"><div class="tab-pane active" id="horizontal-form">
						<form class="form-horizontal" id="page-form" name="package">
					<div class="form-group">
						<label class="col-sm-2 control-label">Select page</label>
						<div class="col-sm-8"><select name="menu1" id="page-select">
								<option value="" selected="selected" class="form-control">***Select One***</option>
								<option value="terms">terms and condition</option>
								<option value="privacy">privacy and policy</option>
								<option value="aboutus">aboutus</option>
								<option value="contact">Contact us</option>
							</select></div>
					</div>
					<div class="form-group">
						<label class="col-sm-2 control-label">Selected Page</label>
						<div class="col-sm-8"><span id="page-name"></span></div>
					</div>
					<div id="editor-wrap" style="display:none">
					<div class="form-group">
						<label class="col-sm-2 control-label">Page Details</label>
						<div class="col-sm-8"><textarea class="form-control" rows="8" cols="50" name="pgedetails" id="pgedetails" placeholder="Page Details"></textarea></div>
					</div>
							<div class="row"><div class="col-sm-8 col-sm-offset-2">
								<button type="submit" class="btn-primary btn">Update</button>
							</div></div>
					</div>
						</form>
					</div></div>
				</div>
			</div>
			<div class="inner-block"></div>
			<div id="adm-footer"></div>
		</div>
	</div>
	<div id="adm-sidebar"></div>
	<div class="clearfix"></div>
</div>
<script>
ADM.boot({ crumb: 'Update Page Data' }, function () {
  var NAMES = { terms: 'Terms and Conditions', privacy: 'Privacy And Policy', aboutus: 'About US', contact: 'Contact Us' };
  var type = ADM.qs('type');
  $('#page-select').val(NAMES[type] ? type : '').on('change', function () {
    if (this.value) location.href = 'manage-pages.html?type=' + this.value;
  });
  if (!NAMES[type]) return;

  $('#page-name').text(NAMES[type]);
  $('#pgedetails').val(TMS.pages.get(type) || '');
  $('#editor-wrap').show();
  var editor = new nicEditor({ fullPanel: true }).panelInstance('pgedetails');

  $('#page-form').on('submit', function (e) {
    e.preventDefault();
    var html = nicEditors.findEditor('pgedetails').getContent();
    TMS.pages.set(type, html);
    $('#msg').html(ADM.msg('success', 'Page data updated  successfully'));
  });
});
</script>
</body>
</html>
