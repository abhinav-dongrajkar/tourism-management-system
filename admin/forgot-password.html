<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Admin Forgot Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.min.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href="css/font-awesome.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="css/table-style.css" />
<link rel="stylesheet" type="text/css" href="css/basictable.css" />
<link href='https://fonts.googleapis.com/css?family=Roboto:700,500,300,100italic,100,400' rel='stylesheet' type='text/css'/>
<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="css/icon-font.min.css" type='text/css' />
<link rel="stylesheet" href="css/custom.css" type='text/css' />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/jquery.basictable.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.nicescroll.js"></script>
<script src="js/scripts.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin.js"></script>
</head>
<body>
<div class="main-wthree">
	<div class="container">
		<div class="sin-w3-agile">
			<h2>Forgot Password</h2>
			<form name="chngpwd" id="forgot-form">
				<div class="username"><span class="username">Email id:</span>
					<input type="email" name="email" class="name" placeholder="Reg Email id" required><div class="clearfix"></div></div>
				<div class="username"><span class="username">Mobile No:</span>
					<input type="text" name="mobile" class="name" placeholder="Reg Mobile Number" required maxlength="10"><div class="clearfix"></div></div>
				<div class="password-agileits"><span class="username">New Password:</span>
					<input type="password" class="password" name="newpassword" placeholder="New Password" required><div class="clearfix"></div></div>
				<div class="password-agileits"><span class="username">Confirm Password:</span>
					<input type="password" name="confirmpassword" class="password" placeholder="Confirm Password" required><div class="clearfix"></div></div>
				<div class="login-w3"><input type="submit" class="login" value="Reset"></div>
				<div class="clearfix"></div>
			</form>
			<div class="back"><a href="index.html" style="color: #fff;">Signin</a></div>
		</div>
	</div>
</div>
<script>
$('#forgot-form').on('submit', function (e) {
  e.preventDefault();
  var f = this;
  if (f.newpassword.value !== f.confirmpassword.value) {
    alert('New Password and Confirm Password Field do not match  !!');
    f.confirmpassword.focus();
    return;
  }
  if (TMS.admin.resetPassword($.trim(f.email.value), $.trim(f.mobile.value), f.newpassword.value)) {
    alert('Your Password succesfully changed');
    location.href = 'index.html';
  } else {
    alert('Email id or Mobile no is invalid');
  }
});
</script>
</body>
</html>
