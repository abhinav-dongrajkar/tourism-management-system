<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Admin Change Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.min.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href="css/font-awesome.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="css/table-style.css" />
<link rel="stylesheet" type="text/css" href="css/basictable.css" />
<link href='https://fonts.googleapis.com/css?family=Roboto:700,500,300,100italic,100,400' rel='stylesheet' type='text/css'/>
<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
<link rel="stylesheet" href="css/icon-font.min.css" type='text/css' />
<link rel="stylesheet" href="css/custom.css" type='text/css' />
<script src="js/jquery-2.1.4.min.js"></script>
<script src="js/jquery.basictable.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/jquery.nicescroll.js"></script>
<script src="js/scripts.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/db.js"></script>
<script src="js/admin.js"></script>
</head>
<body>
<div class="page-container">
	<div class="left-content">
		<div class="mother-grid-inner">
			<div id="adm-header"></div>
			<ol class="breadcrumb" id="adm-crumb"></ol>
			<div class="grid-form"><div class="grid-form1">
				<div id="msg"></div>
				<div class="panel-body">
					<form name="chngpwd" id="pwd-form" class="form-horizontal">
						<div class="form-group">
							<label class="col-md-2 control-label">Current Password</label>
							<div class="col-md-8"><div class="input-group">
								<span class="input-group-addon"><i class="fa fa-key"></i></span>
								<input type="password" name="password" class="form-control1" placeholder="Current Password" required>
							</div></div>
						</div>
						<div class="form-group">
							<label class="col-md-2 control-label">New Password</label>
							<div class="col-md-8"><div class="input-group">
								<span class="input-group-addon"><i class="fa fa-key"></i></span>
								<input type="password" name="newpassword" class="form-control1" placeholder="New Password" required>
							</div></div>
						</div>
						<div class="form-group">
							<label class="col-md-2 control-label">Confirm Password</label>
							<div class="col-md-8"><div class="input-group">
								<span class="input-group-addon"><i class="fa fa-key"></i></span>
								<input type="password" name="confirmpassword" class="form-control1" placeholder="Confirm Password" required>
							</div></div>
						</div>
						<div class="col-sm-8 col-sm-offset-2">
							<button type="submit" class="btn-primary btn">Submit</button>
							<button type="reset" class="btn-inverse btn">Reset</button>
						</div>
					</form>
				</div>
			</div></div>
			<div class="inner-block"></div>
			<div id="adm-footer"></div>
		</div>
	</div>
	<div id="adm-sidebar"></div>
	<div class="clearfix"></div>
</div>
<script>
ADM.boot({ crumb: 'Change Password' }, function (user) {
  $('#pwd-form').on('submit', function (e) {
    e.preventDefault();
    var f = this;
    if (f.newpassword.value !== f.confirmpassword.value) {
      alert('New Password and Confirm Password Field do not match  !!');
      f.confirmpassword.focus();
      return;
    }
    if (TMS.admin.changePassword(user, f.password.value, f.newpassword.value)) {
      $('#msg').html(ADM.msg('success', 'Your Password succesfully changed'));
      f.reset();
    } else {
      $('#msg').html(ADM.msg('error', 'Your current password is wrong'));
    }
  });
});
</script>
</body>
</html>
