<!DOCTYPE HTML>
<html>
<head>
<title>TMS | Change Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="css/bootstrap.css" rel='stylesheet' type='text/css' />
<link href="css/style.css" rel='stylesheet' type='text/css' />
<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700,600' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700,300' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet' type='text/css'>
<link href="css/font-awesome.css" rel="stylesheet">
<link href="css/animate.css" rel="stylesheet" type="text/css" media="all">
<link href="css/custom.css" rel="stylesheet" type="text/css">
<script src="js/jquery-1.12.0.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/wow.min.js"></script>
<script src="js/seed.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div id="tms-header"></div>
<div class="banner-1">
	<div class="container">
		<h1 class="wow zoomIn animated" data-wow-delay=".5s">TMS-Tourism Management System</h1>
	</div>
</div>
<div class="privacy">
	<div class="container">
		<h3 class="wow fadeInDown animated" data-wow-delay=".5s">Change Password</h3>
		<div id="msg"></div>
		<form name="chngpwd" id="pwd-form">
			<p style="width: 350px;"><b>Current Password</b> <input type="password" name="password" class="form-control" placeholder="Current Password" required></p>
			<p style="width: 350px;"><b>New  Password</b> <input type="password" class="form-control" name="newpassword" placeholder="New Password" required></p>
			<p style="width: 350px;"><b>Confirm Password</b> <input type="password" class="form-control" name="confirmpassword" placeholder="Confirm Password" required></p>
			<p style="width: 350px;"><button type="submit" class="btn-primary btn">Change</button></p>
		</form>
	</div>
</div>

<div id="tms-footer"></div>
<div id="tms-modals"></div>
<script>
TMS_UI.boot({ auth: true }, function (user) {
  $('#pwd-form').on('submit', function (e) {
    e.preventDefault();
    var f = this;
    if (f.newpassword.value !== f.confirmpassword.value) {
      alert('New Password and Confirm Password Field do not match  !!');
      f.confirmpassword.focus();
      return;
    }
    if (TMS.users.changePassword(user, f.password.value, f.newpassword.value)) {
      $('#msg').html(TMS_UI.msg('success', 'Your Password succesfully changed'));
      f.reset();
    } else {
      $('#msg').html(TMS_UI.msg('error', 'Your current password is wrong'));
    }
  });
});
</script>
</body>
</html>
